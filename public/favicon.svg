<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Woodstack '26">
  <!-- Woodstack '26: five split logs seen end-on, each cut face three
       concentric fills from the poster palette. The tile behind them is the
       PWA manifest's own theme_color and background_color (#3A1A38). -->
  <rect width="512" height="512" fill="#3A1A38"></rect>
  <g>
    <g transform="translate(180 180)"><circle r="76" fill="#E1512A"></circle><circle r="52" fill="#E8A32A"></circle><circle r="28" fill="#3A1A38"></circle></g>
    <g transform="translate(332 180)"><circle r="76" fill="#157F76"></circle><circle r="52" fill="#F7EBD3"></circle><circle r="28" fill="#157F76"></circle></g>
    <g transform="translate(104 332)"><circle r="76" fill="#E8A32A"></circle><circle r="52" fill="#B8336A"></circle><circle r="28" fill="#F7EBD3"></circle></g>
    <g transform="translate(256 332)"><circle r="76" fill="#B8336A"></circle><circle r="52" fill="#E8A32A"></circle><circle r="28" fill="#3A1A38"></circle></g>
    <g transform="translate(408 332)"><circle r="76" fill="#F7EBD3"></circle><circle r="52" fill="#E1512A"></circle><circle r="28" fill="#E8A32A"></circle></g>
  </g>
</svg>

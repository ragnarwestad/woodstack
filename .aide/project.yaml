name: woodstack
description: Estimates when a firewood stack is dry enough to burn — browser-local, installable, no account
generated: 2026-08-22
stack:
  frontend: TypeScript/Vite + React 19 + Mantine, installable PWA (vite-plugin-pwa)
  backend: none — static build, everything runs in the browser
  database: none — stacks live in the visitor's own browser, never leave it
docs:
  - README.md
deployment:
  host: Cloudflare Pages
  build: pnpm build
  output: dist
  # url and preview: added once the Cloudflare dashboard project exists and
  # has assigned its pages.dev address (or a custom domain) — see
  # 03-deployment-and-icon/3-solution.md, risk 3.

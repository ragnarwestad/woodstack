# .aide/project.yaml — the project's identity card.
# TEAM knowledge, committed to git. All keys optional: leave out what
# is unknown rather than guessing. Links over prose.
name: woodstack
description: Estimates when a firewood stack is dry enough to burn — browser-local, installable, no account
generated: 2026-08-22
# The code branch stays open for review instead of being merged at
# archive; every step runs with --push pr. The specs root keeps
# auto-merging.
codeLanding: pr
stack:
  frontend: TypeScript/Vite + React 19 + Mantine, installable PWA (vite-plugin-pwa)
  backend: none — static build, everything runs in the browser
  database: none — stacks live in the visitor's own browser, never leave it
docs:
  - README.md
deployment:
  host: GitHub Pages
  build: pnpm build
  output: dist
  url: https://ragnarwestad.github.io/woodstack/
# Left out until they are real, rather than guessed:
#   dependencies — Open-Meteo (climate normals) is planned, not yet called
#   logging, statistics, reports — nothing set up

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Woodstack">
  <!-- Five split logs seen end-on, stacked. Colours are the PWA manifest's
       own theme_color (#8B4513) and background_color (#1A1512); the cut face
       and rings are lighter tones of the same brown. -->
  <rect width="512" height="512" fill="#1A1512"/>
  <g>
    <g transform="translate(180 180)">
      <circle r="76" fill="#8B4513"/>
      <circle r="62" fill="#C68642"/>
      <circle r="42" fill="none" stroke="#8B4513" stroke-width="6"/>
      <circle r="22" fill="none" stroke="#8B4513" stroke-width="6"/>
    </g>
    <g transform="translate(332 180)">
      <circle r="76" fill="#8B4513"/>
      <circle r="62" fill="#C68642"/>
      <circle r="42" fill="none" stroke="#8B4513" stroke-width="6"/>
      <circle r="22" fill="none" stroke="#8B4513" stroke-width="6"/>
    </g>
    <g transform="translate(104 332)">
      <circle r="76" fill="#8B4513"/>
      <circle r="62" fill="#C68642"/>
      <circle r="42" fill="none" stroke="#8B4513" stroke-width="6"/>
      <circle r="22" fill="none" stroke="#8B4513" stroke-width="6"/>
    </g>
    <g transform="translate(256 332)">
      <circle r="76" fill="#8B4513"/>
      <circle r="62" fill="#C68642"/>
      <circle r="42" fill="none" stroke="#8B4513" stroke-width="6"/>
      <circle r="22" fill="none" stroke="#8B4513" stroke-width="6"/>
    </g>
    <g transform="translate(408 332)">
      <circle r="76" fill="#8B4513"/>
      <circle r="62" fill="#C68642"/>
      <circle r="42" fill="none" stroke="#8B4513" stroke-width="6"/>
      <circle r="22" fill="none" stroke="#8B4513" stroke-width="6"/>
    </g>
  </g>
</svg>
